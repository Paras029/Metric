# How the work is run. Nothing here is secret and nothing here is machine-specific, so this file
# is committed and shared: a change to it is reviewable like any other change, and a team agrees

defaults:
  temperature: 0.3
  # Retries for a gateway that is briefly busy. Anything the model rejects on its merits is
  # raised rather than repeated -- retrying a malformed request only wastes the time it takes to
  max_attempts: 4

# Calls run on one of three tiers, because the work genuinely differs. Each falls back to the model
# named in .env, so nothing changes until you name a smaller one here.
tiers:
  # Reading documents, drafting and revising the intake, the final review. These read a lot,
  # reason at length, and have to justify what they conclude.
  judgement:
    max_tokens: 65536
    reasoning_effort: high
    # model: a-smaller-model

  # Weighing each scenario against its peers. Judgement-shaped, but every chunk of the scenario space
  materiality:
    max_tokens: 32000
    reasoning_effort: medium
    max_attempts: 2

  # Writing each scenario up for the model owner. Mechanical, but people read the result.
  standard:
    max_tokens: 16000
    reasoning_effort: minimal

# How many of the batched calls are in flight at once. This caps overlap, not call count: a large
# run cannot open more connections than the gateway is willing to hold. Raise it if yours
concurrency: 4

# Per call site, one level finer than a tier. A tier is shared by every call doing the same *kind*
# of work -- weighing materiality and checking the review's declared category are both
stages:

  # --- Ingestion. One call each; nothing here batches.
  ingest_read:                    # each group of questions, read from the whole corpus
    # model: a-smaller-model      # judgement tier unless you name one here
    # max_tokens: 65536
    max_attempts: 4
  ingest_resolve:                 # the resolution sweep over what the first reading left open
    # model: a-smaller-model
    max_attempts: 4
  ingest_diagram_read:            # one diagram image, read on its own into boxes and arrows
    # model: a-vision-model       # must accept images
    max_attempts: 4
  ingest_diagram_synthesize:      # every image's reading, joined into one workflow
    # model: a-vision-model       # must accept images
    max_attempts: 4
  ingest_diagram_repair:          # unresolved points, put back to the images
    # model: a-vision-model       # must accept images
    max_attempts: 4

  # --- Intake. One call each.
  intake_draft:                   # drafting the intake, and revising it with your answers
    # model: a-smaller-model
    max_attempts: 4
  intake_repair:                  # filling in what the draft left structurally incomplete
    # model: a-smaller-model
    max_attempts: 4
  intake_reconcile:               # the finished declaration read back whole, once
    # model: a-smaller-model
    max_attempts: 4

  # --- The scenario space passes. These batch, so they also take batch_size and concurrency.
  #     batch_size is how many rows go into one call; concurrency is how many such calls run at
  writer:                         # writing each scenario up for the model owner
    # model: a-smaller-model      # standard tier unless you name one here
    batch_size: 8
    concurrency: 4
    max_attempts: 4
  materiality_assess:             # a tier per scenario, judged against its peers
    # model: a-smaller-model      # materiality tier unless you name one here
    batch_size: 10
    concurrency: 4
    max_attempts: 2
  reviewer_assess:                # materiality settled and weak scenarios flagged
    # model: a-smaller-model
    batch_size: 6
    concurrency: 4
    max_attempts: 4
  reviewer_category:              # the declared ending, read back against the route
    # model: a-smaller-model      # materiality tier unless you name one here
    batch_size: 20
    concurrency: 4
    max_attempts: 2
  reviewer_propose:               # what enumeration could not reach
    # model: a-smaller-model
    max_attempts: 4
  coverage_migrate:               # working out which column of a submission is which
    # model: a-smaller-model
    max_attempts: 2
  coverage_map:                   # submitted conversations, onto the scenario space
    # model: a-smaller-model
    batch_size: 5
    concurrency: 4
    max_attempts: 4

# --- An LLM council: three models on one judgement, for the passes where a second opinion is
#     worth what it costs. Off unless you switch it on and name the models.
council:
  enabled: off                    # the master switch; every stage below needs it on
  # workers:                      # exactly two. Different models make a better council than one
  #   - a-model                   # model called twice, which mostly agrees with itself.

  stages:
    ingest_read: off              # reading the documents -- the first judgement of the run, and
    ingest_resolve: off           # the one every later stage inherits without re-checking
    ingest_diagram_read: off      # each workflow image, read on its own
    ingest_diagram_synthesize: off
    ingest_diagram_repair: off
    intake_draft: off             # the declaration the whole scenario space is built from
    intake_repair: off            # filling in what that draft left structurally incomplete
    intake_reconcile: off         # the finished declaration read back whole, once
    reviewer_assess: off          # materiality settled and weak scenarios flagged
    reviewer_propose: off         # what enumeration could not reach
    coverage_map: off             # the model owner's conversations, onto the scenario space

ingestion:
  # Whether the intake stage reads the pack as a tool-calling loop instead of as a fixed
  # sequence of calls. Off by default.
  intake_loop: off

  # How much submitted text goes into one reading call. Four characters to a token puts this near
  # 500k tokens, well inside a million-token window. A pack larger than this is split across
  max_corpus_chars: 2000000

  # How much supplementary context one later call carries: the reading of the documents plus
  # every note and answer. Generous on purpose -- roughly 100k tokens against models that hold a
  max_context_chars: 400000

  # How many times a question the first reading left open is put back to the documents before a
  # person is asked. Each pass is one call over the whole corpus, and each question it settles is
  resolve_passes: 2

  # Whether the model accepts images alongside text. Off where the gateway rejects the multimodal
  # request shape: diagrams are then recorded as needing a written description rather than failing
  vision: true
  max_image_bytes: 4000000

# Redacting PII out of submitted documents before any of their text reaches a model call.
# Off by default so the tool runs unmodified wherever the internal pii-redactor package has not
redaction:
  enabled: false
  mode: masking
  replacement_text: "[REDACTED]"
  # strict | balanced | loose. Omit to take the engine's own default.
  # sensitivity: balanced
