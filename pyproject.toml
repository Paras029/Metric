[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metric"
version = "5.0.0"
description = "Builds independent test benchmarks for conversational AI agents"
requires-python = ">=3.12"

dependencies = [
    # Model access. SafeChain returns a LangChain chat model.
    "safechain",
    "langchain-core",

    "openpyxl",
    "python-dotenv",
    "pyyaml",

    # Document readers. Each is imported inside the reader that needs it, so a package missing
    # from an internal mirror disables one format rather than the tool.
    "pypdf",
    "python-docx",
    "python-pptx",
    "Pillow",

    # Unpinned, and the code stays on the Flask 1.x interface, so whatever an internal mirror
    # carries will run it.
    "flask",
]

[project.scripts]
metric = "metric.cli:main"

[tool.setuptools.packages.find]
include = ["metric*"]

[tool.setuptools.package-data]
# Read at run time, so they travel with the package.
metric = ["**/prompts/*.md", "**/*.yaml", "web/templates/*.html", "web/static/*.css",
          "web/static/*.js"]
